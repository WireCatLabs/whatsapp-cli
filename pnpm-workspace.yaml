# pnpm blocks dependencies' install scripts by default, so esbuild never unpacks its platform
# binary and vitest fails at startup. Since pnpm 11 the key is `allowBuilds` here, with an explicit
# boolean per package.
allowBuilds:
  esbuild: true
  lefthook: true
minimumReleaseAgeExclude:
  - '@wirecat/*'

ignoredOptionalDependencies:
  # The engine packages of a version reach npm only when it is released, and pnpm cannot lock a package npm does
  # not have yet; a checkout runs the engine `pnpm engine:build` writes instead.
  - "@wirecat/whatsapp-engine-*"

overrides:
  micromark-extension-math>katex: 0.18.2
