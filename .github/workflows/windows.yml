name: Windows and macOS

# Never on a pull request (cli-base WC-CI-5): the release and the monthly run call it, and it runs by hand on request.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      WA_NO_UPDATE_CHECK: "1"
    steps:
      # Otherwise checkout turns every line ending into CRLF and fixtures stop matching.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # These runners are slower than ubuntu's; max-cli saw five seconds time out tests that do not hang.
      - run: pnpm test --testTimeout=20000
      - run: pnpm build
      # Commands that need no login and reach no network.
      - run: node dist/bin/wa.js --version
      - run: node dist/bin/wa.js doctor --json
      - run: node dist/bin/wa.js default mcp config --json
      - run: node dist/bin/wa.js commands --json
