name: Monthly validation

on:
  schedule:
    - cron: "24 2 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@36debb605b6909e77636ba873821c861bc5186a8 # Go dependency audit
    with:
      dependencies: true
      languages: '["actions","javascript-typescript","go"]'
      govulncheck: true
      go-version-file: engine/go.mod
