name: Monthly validation

on:
  schedule:
    - cron: "24 2 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@4dcab561d9187b348b62bbb603e3ab6ea8678997 # cli-base main at #593: every CodeQL action at one version
    with:
      dependencies: true
      languages: '["actions","javascript-typescript","go"]'
      govulncheck: true
      go-version-file: engine/go.mod
