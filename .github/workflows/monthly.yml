name: Monthly validation

on:
  schedule:
    - cron: "21 3 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@f61dc446e2485a6d1f2c7e2e842562db9e47a39d # Go analysis support
    with:
      dependencies: true
      languages: '["actions","javascript-typescript","go"]'
      go-version-file: engine/go.mod
