name: Full validation

on:
  workflow_call:
    inputs:
      pack:
        type: boolean
        default: false
      skip-platforms:
        type: boolean
        default: false
    outputs:
      package-sha256:
        value: ${{ jobs.ci.outputs.package-sha256 }}
      engine-packages-sha256:
        description: "SHA-256 of the SHA256SUMS listing the six engine tarballs, when pack is true"
        value: ${{ jobs.engine.outputs.packages-sha256 }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: WireCatLabs/cli-base/.github/workflows/node-ci.yml@a579c725569e103afe548422b714bd72115aef53 # v0.65.0
    with:
      pack: ${{ inputs.pack || false }}
      pack-checks: node --experimental-strip-types scripts/release-check.ts --artifact-only
      bun-run: pnpm build && pnpm smoke:bun
      # The test matrix is rebuilt from this run's argv log, so the diff also catches a stale
      # test-matrix.md; the parity lines read the command tree from the dist/ built above.
      checks: |
        pnpm smoke:node
        pnpm contracts:check
        pnpm contracts:upgrade
        pnpm security:no-leak
        pnpm version:check
        pnpm bot:generate:check
        pnpm exec cli-dev test-matrix --program dist/program.js --untested scripts/test-matrix-untested.ts --name wa --check
        node --experimental-strip-types scripts/commands.ts
        git diff --exit-code
        pnpm check:agent-docs
        pnpm docs:check
        pnpm parity:check
        pnpm lint:commands

  engine:
    runs-on: ubuntu-latest
    outputs:
      packages-sha256: ${{ steps.engine-packages.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A release publishes this job's build, so a packing run restores no cache another run could have written.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache: ${{ !inputs.pack }}
          cache-dependency-path: engine/go.sum
      - run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "::error::not gofmt-formatted: $unformatted"; exit 1; }
          go vet ./... && go test ./...
        working-directory: engine
      # The engine ships for six targets, all built from this one runner without a C compiler, by the script the
      # release runs.
      - name: cross-build
        run: node scripts/engine-packages.mjs build
      # node-ci has no Go, so the TypeScript tests that drive the real engine run here or nowhere.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ !inputs.pack && 'pnpm' || '' }}
          package-manager-cache: ${{ !inputs.pack }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The sandbox drops WA_ENGINE, so the shipped linux-x64 build goes where a checkout's own build would.
      - run: mkdir -p engine/bin && cp packages/engine-linux-x64/bin/wa-engine engine/bin/
      - name: the TypeScript client against the built engine
        env:
          WA_ENGINE_TESTS: required
        run: pnpm exec vitest run src/engine/go-engine.test.ts
      # A release packs the engine here, from the build the tests above ran, and names the tarballs' digests:
      # release.yml publishes exactly these files and builds nothing again (WC-REL-12).
      - name: pack engine packages
        id: engine-packages
        if: inputs.pack
        run: |
          node scripts/engine-packages.mjs check
          mkdir engine-packages
          for dir in packages/engine-*; do npm pack "./$dir" --pack-destination engine-packages; done
          [ "$(ls engine-packages/*.tgz | wc -l)" -eq 6 ] || { echo "::error::expected six engine packages"; exit 1; }
          (cd engine-packages && sha256sum -- *.tgz > SHA256SUMS)
          echo "sha256=$(sha256sum engine-packages/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.pack
        with:
          name: validated-engine-packages
          path: engine-packages/
          if-no-files-found: error
          retention-days: 7

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A warning, never a failure: bin/release takes the next free version itself (2026-09-29).
      - name: version above main and npm
        continue-on-error: true
        run: |
          pr=$(node -p 'require("./package.json").version')
          git fetch -q --depth=1 origin main
          main=$(git show FETCH_HEAD:package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          [ "$pr" != "$main" ] || exit 0
          name=$(node -p 'require("./package.json").name')
          latest=$(npm view "$name" version 2>/dev/null || true)
          floor=$(printf '%s\n%s\n' "$main" "$latest" | sort -V | tail -1)
          versions=$(npm view "$name" versions --json 2>/dev/null || true)
          next=$(node scripts/next-version.mjs "$pr" "$floor" "$versions")
          [ "$next" != "$pr" ] || exit 0
          echo "::warning file=package.json::version $pr is not above both main ($main) and npm's latest ($latest)" \
            "— bin/release will publish it as $next"

  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: install vale
        env:
          VALE_VERSION: 3.23.0
          VALE_SHA256: cc35445a45186b8f0b01e11c01359694cf941e72cf6ab0fc44774f0e54c9d5fc
        run: |
          curl -sSfLo vale.tar.gz "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  vale.tar.gz" | sha256sum -c -
          tar -xzf vale.tar.gz vale
      # Style findings are annotations until the rules are tuned; the tone rule (an error) fails.
      - run: ./vale --output line README.md docs/*.md | sed 's/^/::warning::/' || true
      - run: ./vale --minAlertLevel error README.md docs/*.md

  windows:
    if: ${{ !inputs.skip-platforms }}
    uses: ./.github/workflows/windows.yml

  install_windows:
    if: ${{ !inputs.skip-platforms }}
    uses: ./.github/workflows/install-windows.yml
